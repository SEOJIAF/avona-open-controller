<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Avona</title>
<style>
  :root {
    --bg: #f6f4f0; --card: #ffffff; --text: #1d1d1b; --muted: #6b6860; --line: #e2ded6;
    --accent: #d2491f; --accent-text: #ffffff; --ok: #2e7d4f; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --card: #22201d; --text: #f2efe9; --muted: #a29d93; --line: #36332e;
            --accent: #ff7a4d; --accent-text: #1a0d07; --ok: #6fcf97; --bad: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .pill { font-size: .8rem; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .pill.on { color: var(--ok); border-color: var(--ok); }
  .pill.off { color: var(--bad); border-color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 600; }
  .muted { color: var(--muted); font-size: .9rem; }
  .temps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 18px 0; }
  .big { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  input, select { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
           color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .actions select { width: auto; }
  .account { margin: -8px 0 18px; align-items: center; }
  .account button { padding: 6px 12px; font-size: .85rem; }
  .add { color: var(--accent); font-size: .9rem; margin-right: 8px; font-weight: 600; text-decoration: none; }
  .msg { min-height: 1.2em; font-size: .85rem; margin-top: 10px; }
  .msg.err { color: var(--bad); }
  @media (max-width: 480px) {
    .temps { grid-template-columns: 1fr 1fr; }
    form { grid-template-columns: 1fr 1fr; }
    form button { grid-column: span 2; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Open Avona</h1>
    <span id="conn" class="pill">connecting…</span>
  </header>
  <div class="row account"><span class="muted" id="who"></span>
    <span><a class="add" href="/setup">+ Add a cooker</a> <button id="logout" type="button">Sign out</button></span></div>
  <div id="devices"><div class="card muted" id="empty">Loading your cookers…</div></div>
</main>
<template id="tpl">
  <div class="card">
    <div class="row"><span class="name"></span><span class="muted meta"></span></div>
    <div class="temps">
      <div><div class="label">Water</div><div class="big current">–</div></div>
      <div><div class="label">Target</div><div class="big target">–</div></div>
      <div><div class="label">Timer</div><div class="big timer">–</div></div>
    </div>
    <form>
      <label>Target temp <input name="temp" type="number" step="0.5" required></label>
      <label>Timer (min, 0 = none) <input name="timer" type="number" min="0" step="1" value="0"></label>
      <button class="primary" type="submit">Start</button>
    </form>
    <div class="actions">
      <button data-act="temperature">Update temp</button>
      <button data-act="timer">Update timer</button>
      <button data-act="stop">Stop</button>
      <select data-act="unit" aria-label="Unit"><option value="C">°C</option><option value="F">°F</option></select>
    </div>
    <div class="msg"></div>
  </div>
</template>
<script>
const devices = new Map();
const cards = new Map();
const $ = (sel, el = document) => el.querySelector(sel);

// Normalizes both state formats the cloud sends:
//  - 3rd gen (a6-a9): SousVideState {state, nodes, systemInfo}
//  - 2nd gen Wi-Fi (a4, a5, Pro): legacy WifiCookerState body {job, job-status, temperature-info, pin-info, ...}
function view(d) {
  const s = d.state ?? {};
  if (s.job || s['temperature-info'] || s['job-status']) {
    const job = s.job ?? {}, status = s['job-status'] ?? {};
    const remaining = status['cook-time-remaining'];
    return {
      unit: String(job['temperature-unit'] ?? 'C').toUpperCase() === 'F' ? 'F' : 'C',
      current: s['temperature-info']?.['water-temperature'],
      target: job['target-temperature'],
      mode: [job.mode, status.state].filter(Boolean).join(' / ').toLowerCase(),
      timer: job['cook-time-seconds'] ? { initial: remaining ?? job['cook-time-seconds'], remainingOnly: true } : null,
      lowWater: Boolean(s['pin-info']?.['water-level-low'] || s['pin-info']?.['water-level-critical']),
    };
  }
  const n = s.nodes ?? {};
  return {
    unit: s.state?.temperatureUnit === 'F' ? 'F' : 'C',
    current: n.waterTemperatureSensor?.current?.celsius,
    target: n.waterTemperatureSensor?.setpoint?.celsius,
    mode: s.state?.mode,
    timer: n.timer,
    lowWater: n.lowWater?.warning,
    online: s.systemInfo?.online,
  };
}
const unitOf = (d) => view(d).unit;
const fmt = (c, unit) => c == null ? '–' : (unit === 'F' ? (c * 1.8 + 32).toFixed(1) + '°F' : Number(c).toFixed(1) + '°C');

function timerText(t) {
  if (!t || !t.initial) return '–';
  let left = t.initial;
  if (t.remainingOnly) t = { ...t, mode: null };
  if (t.startedAtTimestamp && t.mode === 'running') left -= (Date.now() - Date.parse(t.startedAtTimestamp)) / 1000;
  left = Math.max(0, Math.round(left));
  const h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = left % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}

async function act(id, action, body = {}) {
  const msg = $('.msg', cards.get(id));
  msg.className = 'msg'; msg.textContent = 'Sending ' + action + '…';
  try {
    const r = await fetch(`/api/devices/${encodeURIComponent(id)}/${action}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 401) return location.replace('/login');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    msg.textContent = action + ': ok';
  } catch (e) { msg.className = 'msg err'; msg.textContent = action + ' failed: ' + e.message; }
}

function ensureCard(d) {
  if (cards.has(d.cookerId)) return cards.get(d.cookerId);
  const el = $('#tpl').content.firstElementChild.cloneNode(true);
  const id = d.cookerId;
  const form = $('form', el);
  const vals = () => ({ targetTemperature: Number(form.temp.value), timerMinutes: Number(form.timer.value || 0),
                        unit: unitOf(devices.get(id)) });
  form.addEventListener('submit', (e) => { e.preventDefault(); act(id, 'start', vals()); });
  el.querySelectorAll('button[data-act]').forEach((b) => b.addEventListener('click', () => act(id, b.dataset.act, vals())));
  $('select', el).addEventListener('change', (e) => act(id, 'unit', { unit: e.target.value }));
  cards.set(id, el);
  return el;
}

let listLoaded = false;
function render() {
  const root = $('#devices');
  if (!devices.size) {
    if (listLoaded && $('#empty')) $('#empty').innerHTML = 'No cookers in this account yet. <a href="/setup">Add a cooker</a> to get started.';
    return;
  }
  $('#empty')?.remove();
  for (const d of devices.values()) {
    const el = ensureCard(d);
    if (!el.isConnected) root.appendChild(el);
    const v = view(d), unit = v.unit;
    $('.name', el).textContent = d.name || d.cookerId;
    $('.meta', el).textContent = [d.type, v.mode, v.online === false ? 'offline' : null, v.lowWater ? 'low water' : null,
      d.state ? null : 'no status from the cloud yet'].filter(Boolean).join(' · ');
    $('.current', el).textContent = fmt(v.current, unit);
    $('.target', el).textContent = fmt(v.target, unit);
    $('.timer', el).textContent = timerText(v.timer);
    $('select', el).value = unit;
    const input = el.querySelector('input[name=temp]');
    if (el.dataset.unit && el.dataset.unit !== unit && input.value) {
      const v = Number(input.value);
      input.value = (unit === 'F' ? v * 1.8 + 32 : (v - 32) / 1.8).toFixed(1);
    }
    el.dataset.unit = unit;
    if (!input.value && v.target != null) {
      const c = v.target;
      input.value = unit === 'F' ? (c * 1.8 + 32).toFixed(1) : c;
    }
  }
}

fetch('/api/me').then((r) => {
  if (r.status === 401) return location.replace('/login');
  return r.json().then((me) => { $('#who').textContent = 'Signed in as ' + me.email; });
});
$('#logout').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.replace('/login');
});

const es = new EventSource('/api/events');
es.onerror = () => fetch('/api/me').then((r) => { if (r.status === 401) location.replace('/login'); });
es.addEventListener('status', (e) => {
  const s = JSON.parse(e.data), pill = $('#conn');
  // Once connected, the cloud sends the account's cooker list right away; an empty list after that means none.
  if (s.connected) setTimeout(() => { listLoaded = true; render(); }, 1500);
  pill.textContent = (s.connected ? 'connected' : 'disconnected') + (s.mock ? ' (mock)' : '');
  pill.className = 'pill ' + (s.connected ? 'on' : 'off');
});
es.addEventListener('devices', (e) => {
  for (const d of JSON.parse(e.data)) devices.set(d.cookerId, { ...devices.get(d.cookerId), ...d });
  render();
});
es.addEventListener('state', (e) => {
  const p = JSON.parse(e.data);
  devices.set(p.cookerId, { ...devices.get(p.cookerId), cookerId: p.cookerId, type: p.type, state: p.state });
  render();
});
setInterval(render, 1000);
</script>
</body>
</html>
